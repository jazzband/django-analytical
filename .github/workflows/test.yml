name: Test

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PY_COLORS: '1'

jobs:
  python-django:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'
        django-version:
        - '5.2'
        - '6.0'
        - '6.1'
        exclude:
        - { python-version: '3.11', django-version: '6.0' }
        - { python-version: '3.11', django-version: '6.1' }
        - { python-version: '3.15', django-version: '5.2' }
        - { python-version: '3.15', django-version: '6.0' }

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          **/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install tox tox-gh-actions

    - name: Tox tests (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
      run: tox
      env:
        DJANGO: ${{ matrix.django-version }}

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        name: Python ${{ matrix.python-version }}
